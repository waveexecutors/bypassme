<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.ME — Link Bypasser & Script Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0d12;--card:#131722;--border:#1e2638;--accent:#2563eb;--text:#f3f4f6;--sub:#9ca3af;--muted:#4b5563;--err:#ef4444;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
        header{border-bottom:1px solid var(--border)}
        .header-container{max-width:1000px;margin:0 auto;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
        .logo{font-size:1.4rem;font-weight:800;text-decoration:none}
        .logo-b{color:#fff}
        .logo-me{color:var(--accent);font-family:var(--mono)}
        .nav-tabs{display:flex;gap:.25rem;background:var(--card);padding:.25rem;border-radius:8px;border:1px solid var(--border)}
        .tab-btn{background:transparent;border:none;color:var(--sub);padding:.45rem 1rem;font-family:var(--sans);font-size:.85rem;font-weight:600;border-radius:6px;cursor:pointer}
        .tab-btn.active{background:var(--accent);color:#fff}
        main{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;width:100%;flex:1}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .panel-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
        .panel-title{font-size:1.2rem;font-weight:700;margin-bottom:.25rem}
        .panel-desc{color:var(--sub);font-size:.875rem;margin-bottom:1.25rem}
        .input-group{display:flex;gap:.5rem;flex-direction:column}
        @media(min-width:640px){.input-group{flex-direction:row}}
        .input-field{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-family:var(--sans);font-size:.9rem;outline:none}
        .input-field:focus{border-color:var(--accent)}
        .btn-action{background:var(--accent);color:#fff;border:none;padding:.75rem 1.5rem;font-family:var(--sans);font-size:.9rem;font-weight:600;border-radius:8px;cursor:pointer;white-space:nowrap}
        .btn-action:disabled{opacity:.6;cursor:not-allowed}
        .status-area{margin-top:1rem;display:flex;align-items:center;gap:.75rem;font-size:.9rem;min-height:2rem}
        .spinner{width:1.25rem;height:1.25rem;border:2px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:none}
        @keyframes spin{to{transform:rotate(360deg)}}
        .result-box{margin-top:.5rem;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:none}
        .result-box.active{display:block}
        .result-label{font-size:.75rem;text-transform:uppercase;color:var(--sub);margin-bottom:.5rem;font-weight:700}
        .result-value{font-family:var(--mono);font-size:.85rem;color:#a78bfa;word-break:break-all}
        .error-message{color:var(--err);font-size:.85rem;margin-top:.5rem;display:none}
        .scripts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
        .script-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;justify-content:space-between}
        .script-title{font-size:.95rem;font-weight:700;margin-bottom:.25rem}
        .game-name{color:var(--sub);font-size:.8rem;margin-bottom:1rem}
        .script-code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;font-family:var(--mono);font-size:.75rem;color:var(--sub);white-space:nowrap;overflow-x:auto;margin-bottom:1rem}
        .btn-copy{background:transparent;color:var(--text);border:1px solid var(--border);padding:.5rem;font-family:var(--sans);font-size:.8rem;font-weight:600;border-radius:6px;cursor:pointer;width:100%;transition:all .2s}
        .btn-copy:hover{border-color:var(--accent);color:var(--accent)}
        footer{border-top:1px solid var(--border);padding:1.25rem 1.5rem;text-align:center;color:var(--muted);font-size:.8rem}
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="#" class="logo"><span class="logo-b">B.</span><span class="logo-me">ME</span></a>
            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="bypass">Bypass</button>
                <button class="tab-btn" data-tab="scripts">Scripts Hub</button>
            </nav>
        </div>
    </header>

    <main>
        <section id="tab-bypass" class="tab-content active">
            <div class="panel-box">
                <div class="panel-title">Universal Link Bypasser</div>
                <div class="panel-desc">Supports LootLabs, PlatoBoost, Linkvertise and many more.</div>
                <div class="input-group">
                    <input type="text" class="input-field" id="bypass-url" placeholder="Paste link here (https://...)" autocomplete="off">
                    <button class="btn-action" id="btn-bypass">Bypass Link</button>
                </div>
                <div class="status-area">
                    <div class="spinner" id="spinner"></div>
                    <span id="status-text" style="color:var(--sub)"></span>
                </div>
                <div class="error-message" id="bypass-error"></div>
                <div class="result-box" id="bypass-result">
                    <div class="result-label">Destination Link</div>
                    <div class="result-value" id="result-url"></div>
                </div>
            </div>
        </section>

        <section id="tab-scripts" class="tab-content">
            <div class="panel-box">
                <div class="input-group">
                    <input type="text" class="input-field" id="script-search" placeholder="Search ScriptBlox...">
                </div>
            </div>
            <div class="scripts-grid" id="scripts-container"></div>
        </section>
    </main>

    <footer>B.ME &mdash; Independent Utility Tool</footer>

    <script>
        // ========== TAB SWITCHING (fixed) ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'scripts') loadScripts();
            });
        });

        // ========== BYPASS API ==========
        const bypassBtn = document.getElementById('btn-bypass');
        const urlInput = document.getElementById('bypass-url');
        const errorMsg = document.getElementById('bypass-error');
        const resultBox = document.getElementById('bypass-result');
        const resultUrl = document.getElementById('result-url');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('status-text');

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            spinner.style.display = 'none';
            statusText.innerText = '';
            resultBox.classList.remove('active');
        }

        function clearError() {
            errorMsg.style.display = 'none';
            errorMsg.innerText = '';
        }

        function setStatus(msg) { statusText.innerText = msg; }

        function showLoading(show) {
            spinner.style.display = show ? 'inline-block' : 'none';
            bypassBtn.disabled = show;
            bypassBtn.innerText = show ? 'Processing...' : 'Bypass Link';
        }

        async function bypassUrl(url) {
            if (!url || !url.startsWith('http')) throw new Error('Please enter a valid URL.');
            setStatus('Fetching destination...');
            
            const proxies = [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url='
            ];
            
            let html = null;
            for (const proxy of proxies) {
                try {
                    const proxyUrl = proxy.includes('?') ? proxy + encodeURIComponent(url) : proxy + url;
                    const resp = await fetch(proxyUrl, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    if (!resp.ok) throw new Error(`Proxy returned ${resp.status}`);
                    html = await resp.text();
                    break;
                } catch (e) { continue; }
            }
            
            if (!html) throw new Error('All proxies failed. Try again later.');
            
            setStatus('Extracting destination link...');
            
            // Meta refresh
            const metaMatch = html.match(/<meta[^>]*http-equiv\s*=\s*["']?refresh["']?[^>]*content\s*=\s*["']?\d*;\s*url=([^"'>\s]+)/i);
            if (metaMatch && metaMatch[1]) return decodeURIComponent(metaMatch[1]);
            
            // JS redirects
            const patterns = [
                /window\.location\.href\s*=\s*["']([^"']+)["']/i,
                /window\.location\s*=\s*["']([^"']+)["']/i,
                /location\.href\s*=\s*["']([^"']+)["']/i,
                /location\.replace\s*\(\s*["']([^"']+)["']\s*\)/i
            ];
            
            for (const p of patterns) {
                const m = html.match(p);
                if (m && m[1]) {
                    let link = m[1];
                    if (link.startsWith('/')) {
                        const base = new URL(url);
                        link = base.origin + link;
                    } else if (!link.startsWith('http')) {
                        link = new URL(link, url).href;
                    }
                    return link;
                }
            }
            
            // Fallback: external links
            const hrefRegex = /<a[^>]*href\s*=\s*["']([^"']+)["'][^>]*>/gi;
            let match;
            const candidates = [];
            const baseDomain = new URL(url).hostname;
            
            while ((match = hrefRegex.exec(html)) !== null) {
                let link = match[1];
                if (link.startsWith('#') || link.startsWith('javascript:')) continue;
                if (link.startsWith('/')) {
                    link = new URL(url).origin + link;
                } else if (!link.startsWith('http')) {
                    try { link = new URL(link, url).href; } catch { continue; }
                }
                try {
                    const domain = new URL(link).hostname;
                    if (domain === baseDomain) continue;
                    if (domain.includes('google') || domain.includes('facebook')) continue;
                    candidates.push(link);
                } catch { continue; }
            }
            
            if (candidates.length > 0) return candidates[0];
            throw new Error('Could not extract destination link.');
        }

        bypassBtn.addEventListener('click', async () => {
            const inputVal = urlInput.value.trim();
            clearError();
            resultBox.classList.remove('active');
            resultUrl.innerText = '';
            
            if (!inputVal) { showError('Please enter a URL.'); return; }
            if (!inputVal.startsWith('http')) { showError('URL must start with http:// or https://'); return; }
            
            showLoading(true);
            setStatus('Starting bypass...');
            
            try {
                const finalUrl = await bypassUrl(inputVal);
                resultUrl.innerText = finalUrl;
                resultBox.classList.add('active');
                setStatus('✅ Bypass successful!');
                spinner.style.display = 'none';
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); bypassBtn.click(); }
        });

        // ========== SCRIPTBLOX API (real data) ==========
        const SCRIPTS_CONTAINER = document.getElementById('scripts-container');
        const SEARCH_INPUT = document.getElementById('script-search');
        let searchTimeout;

        async function loadScripts(query = '') {
            SCRIPTS_CONTAINER.innerHTML = '<div style="color:var(--sub);grid-column:1/-1;text-align:center;padding:2rem">Loading scripts...</div>';
            
            try {
                // Use the public ScriptBlox proxy API
                const baseUrl = 'https://scriptblox-api-proxy.vercel.app/api';
                let url;
                
                if (query) {
                    url = `${baseUrl}/search?q=${encodeURIComponent(query)}`;
                } else {
                    url = `${baseUrl}/fetch`;
                }
                
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('API request failed');
                const data = await resp.json();
                
                // Handle different response structures
                const scripts = data.result?.scripts || data.scripts || data;
                
                if (!scripts || scripts.length === 0) {
                    SCRIPTS_CONTAINER.innerHTML = '<div style="color:var(--sub);grid-column:1/-1;text-align:center;padding:2rem">No scripts found.</div>';
                    return;
                }
                
                renderScriptCards(scripts);
            } catch (err) {
                SCRIPTS_CONTAINER.innerHTML = `<div style="color:var(--err);grid-column:1/-1;text-align:center;padding:2rem">Error loading scripts: ${err.message}</div>`;
            }
        }

        function renderScriptCards(scripts) {
            SCRIPTS_CONTAINER.innerHTML = '';
            
            scripts.slice(0, 24).forEach(script => {
                const card = document.createElement('div');
                card.className = 'script-card';
                
                const title = script.title || 'Untitled Script';
                const game = script.game?.name || script.game || 'Unknown Game';
                const rawCode = script.script || script.code || script.rawScript || '';
                const displayCode = rawCode.substring(0, 80) + (rawCode.length > 80 ? '...' : '');
                
                card.innerHTML = `
                    <div>
                        <div class="script-title">${escapeHtml(title)}</div>
                        <div class="game-name">${escapeHtml(game)}</div>
                        <div class="script-code">${escapeHtml(displayCode)}</div>
                    </div>
                    <button class="btn-copy" data-script="${escapeHtml(rawCode)}">Copy Script</button>
                `;
                
                // Use event delegation for copy button
                card.querySelector('.btn-copy').addEventListener('click', function() {
                    const code = this.dataset.script;
                    navigator.clipboard.writeText(code).then(() => {
                        this.innerText = 'Copied!';
                        setTimeout(() => { this.innerText = 'Copy Script'; }, 2000);
                    }).catch(() => {
                        this.innerText = 'Failed to copy';
                        setTimeout(() => { this.innerText = 'Copy Script'; }, 2000);
                    });
                });
                
                SCRIPTS_CONTAINER.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        // Search with debounce
        SEARCH_INPUT.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadScripts(e.target.value.trim());
            }, 500);
        });

        // Initial load when switching to scripts tab
        document.querySelector('[data-tab="scripts"]').addEventListener('click', () => loadScripts());
    </script>
</body>
</html>
