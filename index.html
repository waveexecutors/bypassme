<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.ME — Link Bypasser & Script Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-color: #131722;
            --border-color: #1e2638;
            --accent-blue: #2563eb;
            --accent-purple: #7c3aed;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #4b5563;
            --error-red: #ef4444;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background: #0b0d12;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.03em;
        }

        .logo-b { color: #ffffff; }
        .logo-me { color: var(--accent-blue); font-family: var(--font-mono); }

        .nav-tabs {
            display: flex;
            gap: 0.25rem;
            background: #131722;
            padding: 0.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 0.45rem 1rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            width: 100%;
            flex: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .panel-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .panel-desc {
            color: var(--text-sub);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .input-group { flex-direction: row; }
        }

        .input-field {
            flex: 1;
            background: #0b0d12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #0b0d12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .result-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #a78bfa;
            word-break: break-all;
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .controls-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .script-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }

        .script-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .game-name {
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .script-code {
            background: #0b0d12;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .btn-copy {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        .btn-copy:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .state-text {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-sub);
            grid-column: 1 / -1;
            font-size: 0.9rem;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo"><span class="logo-b">B.</span><span class="logo-me">ME</span></a>
            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="bypass">Bypass</button>
                <button class="tab-btn" data-tab="scripts">Scripts Hub</button>
            </nav>
        </div>
    </header>

    <main>
        <!-- TAB 1: LOOTLABS BYPASSER -->
        <section id="tab-bypass" class="tab-content active">
            <div class="panel-box">
                <div class="panel-title">LootLabs Link Bypasser</div>
                <div class="panel-desc">Enter a valid LootLabs URL to extract the destination link directly.</div>
                
                <div class="input-group">
                    <input type="text" class="input-field" id="lootlabs-url" placeholder="https://loot-link.com/s?..." autocomplete="off">
                    <button class="btn-action" id="btn-bypass">Bypass Link</button>
                </div>
                <div class="error-message" id="bypass-error">Please enter a valid LootLabs URL.</div>

                <div class="result-box" id="bypass-result">
                    <div class="result-label">Destination Link</div>
                    <div class="result-value" id="result-url"></div>
                </div>
            </div>
        </section>

        <!-- TAB 2: SCRIPTS HUB -->
        <section id="tab-scripts" class="tab-content">
            <div class="controls-bar">
                <input type="text" class="input-field" id="script-search" placeholder="Search scripts by title or game...">
            </div>

            <div class="scripts-grid" id="scripts-container">
                <!-- Dynamically loaded -->
            </div>
        </section>
    </main>

    <footer>
        B.ME &mdash; Independent Utility Tool
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tab switching logic
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTab = button.getAttribute('data-tab');

                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));

                    button.classList.add('active');
                    document.getElementById(`tab-${targetTab}`).classList.add('active');

                    if (targetTab === 'scripts') {
                        loadScripts();
                    }
                });
            });

            // LootLabs Bypasser Logic
            const bypassBtn = document.getElementById('btn-bypass');
            const urlInput = document.getElementById('lootlabs-url');
            const errorMsg = document.getElementById('bypass-error');
            const resultBox = document.getElementById('bypass-result');
            const resultUrl = document.getElementById('result-url');

            bypassBtn.addEventListener('click', async () => {
                const inputVal = urlInput.value.trim();
                errorMsg.style.display = 'none';
                resultBox.classList.remove('active');

                if (!inputVal || (!inputVal.includes('lootlabs') && !inputVal.includes('loot-link') && !inputVal.includes('lootlink'))) {
                    errorMsg.innerText = 'Please provide a valid LootLabs link.';
                    errorMsg.style.display = 'block';
                    return;
                }

                bypassBtn.disabled = true;
                bypassBtn.innerText = 'Bypassing...';

                try {
                    // Public API endpoint for LootLabs bypass
                    const apiUrl = `https://api.bypass.vip/bypass?url=${encodeURIComponent(inputVal)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data && data.destination) {
                        resultUrl.innerText = data.destination;
                        resultBox.classList.add('active');
                    } else if (data && data.result) {
                        resultUrl.innerText = data.result;
                        resultBox.classList.add('active');
                    } else {
                        throw new Error('Could not resolve link');
                    }
                } catch (err) {
                    errorMsg.innerText = 'Bypass failed or service unreachable. Try again later.';
                    errorMsg.style.display = 'block';
                } finally {
                    bypassBtn.disabled = false;
                    bypassBtn.innerText = 'Bypass Link';
                }
            });

            // Scripts Hub Logic (ScriptBlox API Integration)
            const searchInput = document.getElementById('script-search');
            let debounceTimer = null;

            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    loadScripts(searchInput.value.trim());
                }, 400);
            });

            async function loadScripts(query = '') {
                const container = document.getElementById('scripts-container');
                container.innerHTML = '<div class="state-text">Loading scripts...</div>';

                const endpoint = query 
                    ? `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&page=1`
                    : `https://scriptblox.com/api/script/fetch?page=1`;

                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(endpoint)}`;

                try {
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error('API offline');
                    
                    const raw = await res.json();
                    const parsed = JSON.parse(raw.contents);

                    const items = parsed.result?.scripts || parsed.scripts || [];

                    if (items.length === 0) {
                        container.innerHTML = '<div class="state-text">No scripts found.</div>';
                        return;
                    }

                    container.innerHTML = '';
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'script-card';
                        
                        const title = escapeHtml(item.title || 'Untitled');
                        const game = escapeHtml(item.game?.name || 'Universal');
                        const scriptText = item.script || `loadstring(game:HttpGet("${item.scriptUrl || ''}"))()`;

                        card.innerHTML = `
                            <div>
                                <div class="script-header">
                                    <div class="script-title">${title}</div>
                                </div>
                                <div class="game-name">${game}</div>
                                <div class="script-code">${escapeHtml(scriptText)}</div>
                            </div>
                            <button class="btn-copy">Copy Script</button>
                        `;

                        const copyBtn = card.querySelector('.btn-copy');
                        copyBtn.addEventListener('click', () => {
                            navigator.clipboard.writeText(scriptText);
                            copyBtn.innerText = 'Copied!';
                            setTimeout(() => { copyBtn.innerText = 'Copy Script'; }, 2000);
                        });

                        container.appendChild(card);
                    });

                } catch (err) {
                    container.innerHTML = '<div class="state-text">Failed to fetch scripts from ScriptBlox API.</div>';
                }
            }

            function escapeHtml(str) {
                return str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m]));
            }
        });
    </script>
</body>
</html>
