<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.ME — Link Bypasser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d12; --card: #131722; --border: #1e2638;
            --accent: #2563eb; --text: #f3f4f6; --sub: #9ca3af;
            --err: #ef4444; --sans: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
        header { border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto; width: 100%; }
        .logo { font-size: 1.4rem; font-weight: 800; }
        .logo-me { color: var(--accent); font-family: var(--mono); }
        main { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
        .panel h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
        .panel p { color: var(--sub); font-size: 0.875rem; margin-bottom: 1.25rem; }
        .input-group { display: flex; gap: 0.5rem; flex-direction: column; }
        @media (min-width: 640px) { .input-group { flex-direction: row; } }
        .input-field { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: var(--sans); font-size: 0.9rem; outline: none; }
        .input-field:focus { border-color: var(--accent); }
        .btn-action { background: var(--accent); color: #fff; border: none; padding: 0.75rem 1.5rem; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }
        .timer-box { margin-top: 1rem; font-family: var(--mono); font-size: 0.9rem; color: #38bdf8; display: none; }
        .status-area { margin-top: 1rem; font-size: 0.9rem; min-height: 2rem; }
        .spinner { width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-box { margin-top: 1rem; padding: 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: none; }
        .result-box.active { display: block; }
        .result-label { font-size: 0.75rem; text-transform: uppercase; color: var(--sub); margin-bottom: 0.5rem; font-weight: 700; }
        .result-value { font-family: var(--mono); font-size: 0.85rem; color: #a78bfa; word-break: break-all; }
        .error-message { color: var(--err); font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">B.<span class="logo-me">ME</span></div>
    </header>
    <main>
        <div class="panel">
            <h2>Universal Link Bypasser</h2>
            <p>Supports LootLabs, Linkvertise, PlatoBoost, Work.ink and 40+ others.</p>
            <div class="input-group">
                <input type="text" class="input-field" id="bypass-url" placeholder="Paste link here (https://...)" autocomplete="off">
                <button class="btn-action" id="btn-bypass">Bypass Link</button>
            </div>
            <div class="timer-box" id="timer-box">⏱ <span id="timer-count">00:00</span></div>
            <div class="status-area" id="status-area"></div>
            <div class="error-message" id="bypass-error"></div>
            <div class="result-box" id="bypass-result">
                <div class="result-label">Destination Link</div>
                <div class="result-value" id="result-url"></div>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('btn-bypass');
        const input = document.getElementById('bypass-url');
        const errorMsg = document.getElementById('bypass-error');
        const resultBox = document.getElementById('bypass-result');
        const resultUrl = document.getElementById('result-url');
        const statusArea = document.getElementById('status-area');
        const timerBox = document.getElementById('timer-box');
        const timerCount = document.getElementById('timer-count');

        let timerInterval = null;

        function startTimer() {
            let seconds = 0;
            timerBox.style.display = 'block';
            clearInterval(timerInterval);
            timerCount.textContent = '00:00';
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                timerCount.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerBox.style.display = 'none';
        }

        btn.addEventListener('click', async () => {
            const url = input.value.trim();
            errorMsg.style.display = 'none';
            resultBox.classList.remove('active');
            resultUrl.textContent = '';
            statusArea.innerHTML = '';

            if (!url || !url.startsWith('http')) {
                errorMsg.textContent = 'Please enter a valid URL.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusArea.innerHTML = '<span class="spinner"></span> Sending to bypass server...';
            startTimer();

            try {
                // BypassLinks free API — no key required
                const resp = await fetch('https://api.bypass-links.com/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || `Server returned ${resp.status}`);
                }

                // The API returns the destination in `result` or `destination`
                const destination = data.result || data.destination || data.url;

                if (!destination) {
                    throw new Error('Bypass failed. The link may be patched or expired.');
                }

                resultUrl.textContent = destination;
                resultBox.classList.add('active');
                statusArea.innerHTML = '✅ Bypass complete!';
            } catch (err) {
                errorMsg.textContent = err.message || 'Bypass failed. Try again.';
                errorMsg.style.display = 'block';
                statusArea.innerHTML = '';
            } finally {
                stopTimer();
                btn.disabled = false;
                btn.textContent = 'Bypass Link';
            }
        });

        // Enter key support
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
        });
    </script>
</body>
</html>
